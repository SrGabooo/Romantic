<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Musical 3D</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <p>"Eres la estrella más linda y todas estas músicas giran en torno a ti"</p>
            <button id="enter-btn">Ir</button>
        </div>
    </div>

    <!-- Contenedor del lienzo 3D -->
    <div id="canvas-container"></div>

    <!-- Interfaz flotante del reproductor -->
    <div id="floating-ui" class="hidden">
        <div class="vinyl-container">
            <div class="vinyl spinning" id="vinyl-disc"></div>
        </div>
        <div class="volume-container">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="white">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <!-- Audio Player Oculto -->
    <audio id="audio-player"></audio>

    <!-- Scripts -->
    <script src="songs.js"></script>
    <script src="main.js"></script>
</body>
</html>
